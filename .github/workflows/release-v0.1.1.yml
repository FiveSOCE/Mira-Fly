name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 0ba7c8a35551883e076053ca7f7ab9b5ea768421
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraFly-0.1.1.jar \
            --target 0ba7c8a35551883e076053ca7f7ab9b5ea768421 \
            --title "MiraFly v0.1.1" \
            --notes "MiraFly now owns faction flight runtime state through MiraFactions v0.2.7, enforces configurable territory/world flight policies, and only consumes timed fly balance while the player is actually flying."
